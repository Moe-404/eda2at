services:
  - type: web
    name: sabeel-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 5000
